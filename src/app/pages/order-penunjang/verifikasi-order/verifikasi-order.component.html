<app-dashboard [ButtonNavigation]="ButtonNavigation" (onClickButtonNavigation)="handleClickButtonNavigation($event)">
    <!-- Grid -->
    <div *ngIf="PageState == 'list'" class="grid w-full bg-white rounded-lg shadow-sm p-2">
        <app-grid [props]="GridProps" (cellClicked)="onCellClicked($event)"
            (rowDoubleClicked)="onRowDoubleClicked($event)" (aksiClicked)="onToolbarClicked($event)"
            (pageChanged)="onPageChanged($event)" (customSearchClicked)="onSearchGrid($event)">
        </app-grid>
    </div>

    <!-- Form -->
    <div *ngIf="PageState == 'form'" class="flex flex-col w-full">
        <div class="grid w-full">
            <app-informasi-pasien #InformasiPasienComps></app-informasi-pasien>
        </div>

        <div class="grid w-full p-3 bg-white rounded-lg shadow-sm mb-3">
            <app-dynamic-form #FormComps [props]="FormProps"></app-dynamic-form>
        </div>

        <div class="grid w-full p-3 gap-3 bg-white rounded-lg shadow-sm mb-3">
            <app-grid [props]="GridDetailProps" (cellClicked)="onCellDetailClicked($event)"
                (aksiClicked)="onToolbarDetailClicked($event)">
            </app-grid>

            <div class="flex w-full justify-end mt-4 gap-4">
                <p-button severity="secondary" label="Kembali" styleClass="p-button-sm" (onClick)="handleBackToList()">
                </p-button>

                <p-button severity="info" label="Verifikasi" styleClass="p-button-sm"
                    (onClick)="handleSaveVerifikasi(FormComps.FormGroup.value)">
                </p-button>
            </div>
        </div>
    </div>

    <!-- Dialog Edit Dokter -->
    <p-dialog header="Edit Dokter" [modal]="true" [draggable]="false" [resizable]="false"
        [(visible)]="ShowDialogEditDokter" [style]="{ width: '20rem' }">

        <!-- Form -->
        <div class="grid w-full mb-3">
            <p-dropdown [(ngModel)]="SelectedDokter" [options]="DokterDatasource" optionLabel="nama"
                class="p-inputtext-sm w-full" [filter]="true" appendTo="body">
            </p-dropdown>
        </div>

        <!-- Button -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm"
                (onClick)="ShowDialogEditDokter = false; SelectedDokter = null">
            </p-button>

            <p-button label="Simpan" severity="info" styleClass="p-button-sm"
                (onClick)="handleSaveDokter(SelectedDokter)">
            </p-button>
        </div>
    </p-dialog>

    <p-confirmDialog />
</app-dashboard>
