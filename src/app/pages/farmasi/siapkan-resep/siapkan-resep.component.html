<app-dashboard [ButtonNavigation]="ButtonNavigation" (onClickButtonNavigation)="handleClickButtonNavigation($event)">
    <div class="flex flex-col gap-3 w-full items-start">
        <div class="flex flex-col w-full gap-3">
            <!-- Form -->
            <div class="grid w-full p-3 bg-white rounded-lg shadow-sm">
                <p class="text-lg font-medium text-gray-700">
                    Detail Resep
                </p>
                <p class="text-sm text-gray-700 mb-3 pb-2 border-b border-t-0 border-x-0 border-dashed border-gray-300">
                    Detail resep dan pasien
                </p>

                <app-dynamic-form #FormComps [props]="FormProps"></app-dynamic-form>
            </div>
        </div>

        <!-- Grid -->
        <div class="grid w-full bg-white rounded-lg shadow-sm p-2">
            <p-table [value]="GridProps.dataSource" [tableStyle]="{'min-width': '50rem'}" [(selection)]="SelectedObats">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 4rem"><p-tableHeaderCheckbox styleClass="p-inputtext-sm" /></th>
                        <th class="text-sm">Nama Obat</th>
                        <th class="text-sm">Aturan Pakai</th>
                        <th class="text-sm">Rute Pemberian Obat</th>
                        <th class="text-sm">Qty</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-antrian>
                    <tr>
                        <td>
                            <p-tableCheckbox [value]="antrian" />
                        </td>
                        <td class="text-sm">{{ antrian.nama_obat }}</td>
                        <td class="text-sm">{{ antrian.aturan_pakai }}</td>
                        <td class="text-sm">{{ antrian.rute_pemberian_obat }}</td>
                        <td class="text-sm">{{ antrian.qty }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <p-confirmDialog />
</app-dashboard>
