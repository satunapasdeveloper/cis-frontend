<app-dashboard [ButtonNavigation]="ButtonNavigation" (onClickButtonNavigation)="handleClickButtonNavigation($event)">
    <div class="flex flex-col w-full">
        <div class="grid w-full">
            <app-informasi-pasien></app-informasi-pasien>
        </div>

        <div class="grid w-full p-3 bg-white rounded-lg shadow-sm mb-4">
            <div
                class="flex items-center justify-between w-full gap-3 {{ ToggleCard ? 'mb-2 pb-2 border-b border-t-0 border-x-0 border-gray-300 border-dashed' : '' }}">
                <div class="flex flex-col">
                    <p class="text-base font-semibold text-gray-700">
                        Riwayat Transfer Tempat Tidur
                    </p>
                    <p class="text-xs text-gray-600">
                        Riwayat transfer tempat tidur pasien
                    </p>
                </div>

                <div class="flex">
                    <p-button icon="pi pi-window-{{ ToggleCard ? 'minimize' : 'maximize' }}" severity="secondary"
                        styleClass="p-button-sm p-button-text" (onClick)="ToggleCard = !ToggleCard"
                        pTooltip="{{ ToggleCard ? 'Sembunyikan' : 'Lihat' }}" tooltipPosition="bottom">
                    </p-button>
                </div>
            </div>

            <div class="{{ ToggleCard ? 'grid' : 'hidden' }} w-full">
                <app-grid [props]="GridProps" (aksiClicked)="onToolbarClicked($event)">
                </app-grid>
            </div>
        </div>

        <div class="grid w-full p-3 bg-white rounded-lg shadow-sm">
            <div
                class="flex items-center justify-between w-full gap-3 mb-2 pb-2 border-b border-t-0 border-x-0 border-gray-300 border-dashed">
                <div class="flex flex-col">
                    <p class="text-base font-semibold text-gray-700">
                        Input Transfer Tempat Tidur
                    </p>
                    <p class="text-xs text-gray-600">
                        Input baru transfer tempat tidur pasien
                    </p>
                </div>
            </div>

            <app-dynamic-form #FormComps [props]="FormProps"></app-dynamic-form>

            <div class="flex w-full justify-end mt-4 gap-4">
                <p-button severity="secondary" label="Kembali" styleClass="p-button-sm" (onClick)="handleBackToList()">
                </p-button>

                <p-button *ngIf="FormState == 'insert'" severity="info" label="Simpan" styleClass="p-button-sm"
                    (onClick)="saveAsalRujukan(FormComps.FormGroup.value)">
                </p-button>

                <p-button *ngIf="FormState == 'update'" severity="warning" label="Update" styleClass="p-button-sm"
                    (onClick)="updateAsalRujukan(FormComps.FormGroup.value)">
                </p-button>
            </div>
        </div>
    </div>

    <p-dialog header="{{ Action | titlecase }} Transfer Tempat Tidur" [modal]="true" [draggable]="false"
        [resizable]="false" [(visible)]="ShowDialogAction" [style]="{ width: '25rem' }">

        <!-- Tanggal Approve -->
        <div *ngIf="Action == 'approve'" class="flex flex-col w-full gap-1 my-3">
            <p class="font-semibold text-gray-700 font-sm">
                Tgl. Approve
            </p>

            <p-calendar [(ngModel)]="Tanggal" [showTime]="true" hourFormat="24" dateFormat="dd MM yy"
                styleClass="p-inputtext-sm w-full" appendTo="body">
            </p-calendar>
        </div>

        <!-- Keterangan Approve -->
        <div *ngIf="Action == 'approve'" class="flex flex-col w-full gap-1 mb-3">
            <p class="font-semibold text-gray-700 font-sm">
                Keterangan
            </p>

            <textarea rows="5" class="p-inputtext-sm w-full" pInputTextarea [(ngModel)]="Keterangan"></textarea>
        </div>

        <!-- Keterangan Batal -->
        <div *ngIf="Action == 'cancel'" class="flex flex-col w-full gap-1 mb-3">
            <p class="font-semibold text-gray-700 font-sm">
                Alasan Batal
            </p>

            <textarea rows="5" class="p-inputtext-sm w-full" pInputTextarea [(ngModel)]="Keterangan"></textarea>
        </div>

        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm" (onClick)="ShowDialogAction = false">
            </p-button>

            <p-button label="Simpan" severity="warning" styleClass="p-button-sm" (onClick)="handleSaveAction(Action)">
            </p-button>
        </div>
    </p-dialog>

    <p-confirmDialog />
</app-dashboard>
