<app-dashboard [ButtonNavigation]="ButtonNavigation" (onClickButtonNavigation)="handleBackToList()">
    <app-informasi-pasien></app-informasi-pasien>

    <div class="grid w-full">
        <p-stepper>
            <!-- Subjective -->
            <p-stepperPanel header="Subjective">
                <ng-template pTemplate="content" let-nextCallback="nextCallback" let-index="index">
                    <div class="flex flex-col justify-between bg-white rounded-lg shadow gap-2 p-3">
                        <!-- <app-anamesis #AnamesisComps></app-anamesis> -->

                        <div class="flex pt-4 justify-end">
                            <p-button severity="info" label="Selanjutnya" icon="pi pi-arrow-right" iconPos="right"
                                styleClass="p-button-sm" (onClick)="handleCreateSubjective(nextCallback)">
                            </p-button>
                        </div>
                    </div>
                </ng-template>
            </p-stepperPanel>

            <!-- Objective -->
            <p-stepperPanel header="Subjective">
                <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                    let-index="index">
                    <div class="flex flex-col justify-between bg-white rounded-lg shadow gap-2 p-3">
                        <!-- <app-anamesis #AnamesisComps></app-anamesis> -->

                        <div class="flex pt-4 justify-between">
                            <p-button severity="info" label="Sebelumnya" icon="pi pi-arrow-left"
                                styleClass="p-button-sm" (onClick)="prevCallback.emit()">
                            </p-button>

                            <p-button severity="info" label="Selanjutnya" icon="pi pi-arrow-right" iconPos="right"
                                styleClass="p-button-sm" (onClick)="handleCreateSubjective(nextCallback)">
                            </p-button>
                        </div>
                    </div>
                </ng-template>
            </p-stepperPanel>

            <!-- Assesment -->
            <p-stepperPanel header="Assesment">
                <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                    let-index="index">
                    <div class="flex flex-col justify-between bg-white rounded-lg shadow gap-2 p-3">
                        <!-- <app-anamesis #AnamesisComps></app-anamesis> -->

                        <div class="flex pt-4 justify-between">
                            <p-button severity="info" label="Sebelumnya" icon="pi pi-arrow-left"
                                styleClass="p-button-sm" (onClick)="prevCallback.emit()">
                            </p-button>

                            <p-button severity="info" label="Selanjutnya" icon="pi pi-arrow-right" iconPos="right"
                                styleClass="p-button-sm" (onClick)="handleCreateSubjective(nextCallback)">
                            </p-button>
                        </div>
                    </div>
                </ng-template>
            </p-stepperPanel>

            <!-- Plan -->
            <p-stepperPanel header="Plan">
                <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                    let-index="index">
                    <div class="flex flex-col justify-between bg-white rounded-lg shadow gap-2 p-3">
                        <!-- <app-anamesis #AnamesisComps></app-anamesis> -->

                        <div class="flex pt-4 justify-between">
                            <p-button severity="info" label="Sebelumnya" icon="pi pi-arrow-left"
                                styleClass="p-button-sm" (onClick)="prevCallback.emit()">
                            </p-button>

                            <p-button severity="info" label="Selanjutnya" icon="pi pi-arrow-right" iconPos="right"
                                styleClass="p-button-sm" (onClick)="handleCreateSubjective(nextCallback)">
                            </p-button>
                        </div>
                    </div>
                </ng-template>
            </p-stepperPanel>

            <!-- Status -->
            <p-stepperPanel header="Status">
                <ng-template pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback"
                    let-index="index">
                    <div class="flex flex-col justify-between bg-white rounded-lg shadow gap-2 p-3">
                        <!-- <app-anamesis #AnamesisComps></app-anamesis> -->

                        <div class="flex pt-4 justify-between">
                            <p-button severity="info" label="Sebelumnya" icon="pi pi-arrow-left"
                                styleClass="p-button-sm" (onClick)="prevCallback.emit()">
                            </p-button>

                            <p-button severity="info" label="Simpan" icon="pi pi-save" styleClass="p-button-sm"
                                (onClick)="handleCreateSubjective(nextCallback)">
                            </p-button>
                        </div>
                    </div>
                </ng-template>
            </p-stepperPanel>
        </p-stepper>
    </div>
</app-dashboard>
