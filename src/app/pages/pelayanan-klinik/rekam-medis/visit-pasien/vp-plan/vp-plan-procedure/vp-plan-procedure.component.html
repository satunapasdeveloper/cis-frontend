<!-- Procedure ICD 9 -->
<div class="flex flex-col w-full bg-white rounded-lg shadow gap-0 p-3">
    <p class="text-gray-700 text-xl font-semibold">
        Procedure ICD 9
    </p>
    <p class="text-gray-700 text-sm mb-3 pb-3 border-b border-gray-300 border-x-0 border-t-0 border-dashed">
        Mohon isi data procedure icd 9 apabila ada
    </p>

    <div class="flex w-full flex-col gap-0">
        <div
            class="flex flex-row gap-2 items-center mb-2 pb-2 border-b border-gray-200 border-x-0 border-t-0 border-solid">
            <div class="w-4/12">
                <p class="text-gray-700 text-sm font-medium">
                    Kode ICD 9
                </p>
            </div>
            <div class="w-6/12">
                <p class="text-gray-700 text-sm font-medium">
                    Nama ICD 9
                </p>
            </div>
            <div class="w-2/12">
                <p class="text-gray-700 text-center text-sm font-medium">
                    Aksi
                </p>
            </div>
        </div>

        @for(item of ProcedureForSave; let i = $index; let last = $last; track item) {
        <div *ngIf="!item.is_new && !item.is_edit" class="flex flex-row gap-2 items-center mb-1">
            <div class="w-4/12 flex">
                <p class="text-gray-700 text-sm">
                    {{ item.kode_icd_9 | titlecase }}
                </p>
            </div>
            <div class="w-6/12">
                <p class="text-gray-700 text-sm">
                    {{ item.nama_icd_9 | titlecase }}
                </p>
            </div>
            <div class="w-2/12 flex justify-center">
                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="warning" styleClass="p-button-sm"
                    (onClick)="handleEditProcedure(i, item)" />

                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" styleClass="p-button-sm"
                    (onClick)="handleDeleteProcedure(i)" />
            </div>
        </div>

        <div *ngIf="item.is_new || item.is_edit" class="flex flex-row w-full gap-2 items-center mb-2">
            <div class="w-4/12">
                <p-dropdown [options]="ProcedureDatasource" optionLabel="nama_icd_9" styleClass="p-inputtext-sm"
                    [style]="{ minWidth: '50px', width: '100%' }" placeholder="Pilih ICD 9" [autoDisplayFirst]="false"
                    [filter]="true" appendTo="body" (onFilter)="handleFilterProcedureDropdown($event)"
                    (onChange)="handleChangeProcedureDropdown($event, i)">
                </p-dropdown>
            </div>
            <div class="w-6/12 flex">
                <input type="text" pInputText readonly class="p-inputtext-sm w-full" [(ngModel)]="item.nama_icd_9">
            </div>
            <div class="w-2/12 flex justify-center">
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" styleClass="p-button-sm"
                    (onClick)="handleDeleteProcedure(i)" />
            </div>
        </div>
        }

        <!-- Footer -->
        <div class="flex items-center justify-center gap-1 py-2 rounded-md bg-gray-100 hover:bg-gray-200 cursor-pointer mt-2"
            (click)="handleAddProcedure()">
            <i class="pi pi-plus" style="font-size: 13px"></i>
            <p class="text-sm text-gray-800 font-medium text-center">
                Tambah Procedure ICD 9
            </p>
        </div>
    </div>
</div>
