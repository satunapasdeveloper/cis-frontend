<div class="flex flex-col w-full bg-white rounded-lg shadow gap-0 p-3">
    <!-- Header -->
    <div
        class="flex justify-between items-center mb-3 pb-3 border-b border-gray-300 border-x-0 border-t-0 border-dashed">
        <div class="flex flex-col">
            <p class="text-gray-700 text-xl font-semibold">
                Tindakan
            </p>
            <p class="text-gray-700 text-sm ">
                Mohon isi data tindakan apabila ada
            </p>
        </div>

        <p-button severity="info" styleClass="p-button-sm" label="Tambah Tindakan" (onClick)="handleAddNewTindakan()">
        </p-button>
    </div>

    <!-- Grid -->
    <div class="grid w-full">
        <app-grid [props]="GridProps" (cellClicked)="onCellClicked($event)"
            (rowDoubleClicked)="onRowDoubleClicked($event)" (aksiClicked)="onToolbarClicked($event)">
        </app-grid>
    </div>

    <!-- Dialog Add / Edit Grup Tarif -->
    <p-dialog [header]="FormState == 'insert' ? 'Tambah Transaksi' : 'Edit Transaksi'" [modal]="true"
        [draggable]="false" [resizable]="false" [(visible)]="ShowDialogForm" [style]="{ width: '40rem' }">

        <!-- Form -->
        <div class="grid w-full mb-3">
            <app-dynamic-form #FormComps [props]="FormProps"></app-dynamic-form>
        </div>

        <!-- Button -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm" (onClick)="ShowDialogForm = false">
            </p-button>

            <p-button *ngIf="FormState == 'insert'" label="Simpan" severity="info" styleClass="p-button-sm"
                (onClick)="handleSaveDetailTransaksi(FormComps.FormGroup.value)">
            </p-button>

            <p-button *ngIf="FormState == 'update'" label="Update" severity="warning" styleClass="p-button-sm"
                (onClick)="handleUpdateDetailTransaksi(FormComps.FormGroup.value)">
            </p-button>
        </div>
    </p-dialog>

    <!-- Dialog Cancel Transaksi -->
    <p-dialog header="Alasan Pembatalan" [modal]="true" [draggable]="false" [resizable]="false"
        [(visible)]="ShowDialogBatal" [style]="{ width: '40rem' }">

        <!-- Form -->
        <div class="grid w-full mb-3">
            <textarea [(ngModel)]="ReasonCanceled" pInputTextarea class="p-inputtext-sm w-full" rows="5"></textarea>
        </div>

        <!-- Button -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm" (onClick)="ShowDialogBatal = false">
            </p-button>

            <p-button label="Simpan" severity="info" styleClass="p-button-sm"
                (onClick)="handleBatalDetailTransaksi(ReasonCanceled)">
            </p-button>
        </div>
    </p-dialog>

    <p-confirmDialog></p-confirmDialog>
</div>
