<div class="flex flex-col w-full bg-white rounded-lg shadow gap-0 p-3">
    <!-- Header -->
    <div
        class="flex justify-between items-center mb-3 pb-3 border-b border-gray-300 border-x-0 border-t-0 border-dashed">
        <div class="flex flex-col">
            <p class="text-gray-700 text-xl font-semibold">
                Order Radiologi
            </p>
            <p class="text-gray-700 text-sm ">
                Mohon isi data order radiologi apabila ada
            </p>
        </div>

        <p-button severity="info" styleClass="p-button-sm" label="Tambah Order Lab" (onClick)="handleAddNewOrder()">
        </p-button>
    </div>

    <!-- Grid -->
    <div class="grid w-full">
        <app-grid [props]="GridProps" (cellClicked)="onCellClicked($event)"
            (rowDoubleClicked)="onRowDoubleClicked($event)" (aksiClicked)="onToolbarClicked($event)">
        </app-grid>
    </div>

    <!-- Dialog Add / Edit Grup Tarif -->
    <p-dialog [header]="FormState == 'insert' ? 'Tambah Transaksi' : 'Edit Transaksi'" [modal]="true"
        [draggable]="false" [resizable]="false" [(visible)]="ShowDialogForm" [style]="{ width: '85vw' }">

        <div class="flex flex-row gap-3 mb-3">
            <!-- Tarif -->
            <div class="w-9/12 grid">
                <p-tabView [scrollable]="true">
                    <p-tabPanel *ngFor="let tab of GrupTarifDatasource" [header]="tab.nama_tarif_grup">
                        <div class="flex w-full gap-3">
                            <!-- Side -->
                            <div class="grid w-3/12 gap-3">
                                <p-button *ngFor="let item of tab.items" styleClass="p-button-sm w-full"
                                    [severity]="SelectedGrupTarif == item ? 'success' : 'info'"
                                    [label]="item.nama_tarif_grup"
                                    (onClick)="SelectedGrupTarif = item; handleClickGrupTarif(item)">
                                </p-button>
                            </div>

                            <!-- Tarif -->
                            <div class="flex flex-col w-9/12 gap-3">
                                <div *ngFor="let tarif of TarifDatasource" class="flex gap-2 items-center">
                                    <p-checkbox [value]="tarif.id_tarif_grup" inputId="{{ tarif.nama_tarif }}"
                                        (onChange)="handleChangeCheckboxTarif($event, tarif)" />
                                    <label for="{{ tarif.nama_tarif }}">
                                        {{ tarif.nama_tarif }}
                                    </label>
                                </div>
                            </div>
                        </div>
                    </p-tabPanel>
                </p-tabView>
            </div>

            <!-- Form -->
            <div class="w-3/12 grid p-2 border border-dashed border-gray-300 rounded-lg">
                <app-dynamic-form #FormComps [props]="FormProps"></app-dynamic-form>

                <div class="grid w-full mt-3 gap-3">
                    <p class="text-sm text-gray-700 font-medium">
                        Daftar Order
                    </p>

                    <div class="flex flex-col w-full gap-2">
                        <!-- Header -->
                        <div class="flex w-full gap-3">
                            <div class="w-9/12">
                                <p class="text-sm text-gray-700">
                                    Nama Order
                                </p>
                            </div>
                            <div class="w-3/12">
                                <p class="text-sm text-gray-700">
                                    Qty
                                </p>
                            </div>
                        </div>

                        <!-- Content -->
                        <div *ngFor="let item of DetailPenunjangDatasource" class="flex w-full gap-3">
                            <div class="w-9/12">
                                <p class="text-sm text-gray-700">
                                    {{ item.nama_tarif }}
                                </p>
                            </div>
                            <div class="w-3/12">
                                <p-inputNumber styleClass="p-inputtext-sm w-full" [(ngModel)]="item.qty">
                                </p-inputNumber>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Button -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm" (onClick)="ShowDialogForm = false">
            </p-button>

            <!-- <p-button *ngIf="FormState == 'insert'" label="Simpan" severity="info" styleClass="p-button-sm"
                (onClick)="handleSaveDetailTransaksi(FormComps.FormGroup.value)">
            </p-button>

            <p-button *ngIf="FormState == 'update'" label="Update" severity="warning" styleClass="p-button-sm"
                (onClick)="handleUpdateDetailTransaksi(FormComps.FormGroup.value)">
            </p-button> -->
        </div>
    </p-dialog>

    <!-- Dialog Cancel Transaksi -->
    <p-dialog header="Alasan Pembatalan" [modal]="true" [draggable]="false" [resizable]="false"
        [(visible)]="ShowDialogBatal" [style]="{ width: '40rem' }">

        <!-- Form -->
        <div class="grid w-full mb-3">
            <textarea [(ngModel)]="ReasonCanceled" pInputTextarea class="p-inputtext-sm w-full" rows="5"></textarea>
        </div>

        <!-- Button -->
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" severity="secondary" styleClass="p-button-sm" (onClick)="ShowDialogBatal = false">
            </p-button>

            <!-- <p-button label="Simpan" severity="info" styleClass="p-button-sm"
                (onClick)="handleBatalDetailTransaksi(ReasonCanceled)">
            </p-button> -->
        </div>
    </p-dialog>

    <p-confirmDialog></p-confirmDialog>
</div>
