<div class="flex flex-col w-full p-3">
    <p class="text-gray-700 text-xl font-semibold">
        Status
    </p>
    <p class="text-gray-700 text-sm mb-4">
        Mohon pilih status pasien
    </p>

    <div class="flex flex-row w-full gap-5 mb-5">
        <div *ngFor="let item of Status"
            class="w-4/12 flex flex-col gap-1 p-3 rounded-md shadow bg-gray-100 items-center justify-center h-[7rem] cursor-pointer
        {{ SelectedStatus == item.id_kondisi_pulang ? 'border border-solid border-sky-500' : 'border border-solid border-gray-300' }}"
            (click)="SelectedStatus = item.id_kondisi_pulang; StatusForSave = item.kondisi_pulang">
            <p class="text-sm text-gray-700 font-medium text-center">
                {{ item.kondisi_pulang }}
            </p>
        </div>
    </div>

    <div class="flex flex-col w-full gap-1">
        <p class="text-sm text-gray-700 font-medium">
            Catatan
        </p>
        <textarea [(ngModel)]="Catatan" pInputTextarea class="p-inputtext-sm w-full" rows="4"></textarea>
    </div>
</div>
